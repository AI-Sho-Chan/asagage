weekly_sell=disable
jcross_sell_require_nky_down=1
jcross_sell_min_gap_bp=20
nky_initial_bp=10
nky_steady_bp=15
alert_cooldown_min=10
bb_flat_k=0.5708
bb_trend_k=1.0000
bb_min_samples=12
bb_sigma_floor=0.05
bb_block_ratio_cap=0.8800
bb_warn_margin=0.2124

# DEMO: force-flat (no overnight holding)
# - demo_soft_flat_time: start exiting positions (H:MM, 24h)
# - demo_flat_time: force exit remaining positions (H:MM, 24h)
# - demo_stop_time: stop DEMO AutoTick entirely after this time (H:MM, 24h)
# - demo_max_hold_min: max minutes to hold a position (timeout-based exit)
demo_soft_flat_time=15:15
demo_flat_time=15:25
demo_stop_time=15:35
demo_max_hold_min=30

# DEMO performance tuning (Excel busy mitigation)
# - demo_autotick_interval_sec: AutoTick frequency (seconds)
# - demo_calc_interval_sec: full calculate + signal/preplace refresh frequency (seconds)
# - demo_driver_trend_interval_sec: trend/driver refresh frequency (seconds)
# - demo_bridge_ms_interval_sec: MarketSnapshot outbox write frequency (seconds)
demo_autotick_interval_sec=15
demo_calc_interval_sec=10
demo_driver_trend_interval_sec=30
demo_bridge_ms_interval_sec=15

# LIVE tuning (defaults; keep if you want to override)
live_autotick_interval_sec=5
live_bridge_ms_interval_sec=5
