cluster_name: asagake-weekend

provider:
  type: aws
  region: ap-northeast-1

auth:
  ssh_user: ec2-user

available_node_types:
  ray.head.default:
    node_config:
      InstanceType: t3.large
      ImageId: latest_dlami
      InstanceMarketOptions:
        MarketType: on-demand
    resources: {CPU: 2}
    min_workers: 0
    max_workers: 0

  ray.worker.highcpu:
    node_config:
      InstanceType: c7i.8xlarge
      ImageId: latest_dlami
      InstanceMarketOptions:
        MarketType: spot
    resources: {CPU: 32}
    min_workers: 0
    max_workers: 4

head_node_type: ray.head.default

setup_commands:
  - sudo yum -y update || true
  - pip install --upgrade pip
  - pip install "ray[default]" pandas numpy yahooquery yfinance optuna pyarrow polars

file_mounts: {}

cluster_synced_files: []

idle_timeout_minutes: 20

docker: {enabled: false}

